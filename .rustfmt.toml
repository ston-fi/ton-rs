match_block_trailing_comma = true
max_width = 120
# Let full-width limits adapt when rustfmt reduces the width inside macro bodies.
use_small_heuristics = "Max"
# Preserve the other default heuristics for max_width = 120.
attr_fn_like_width = 84
struct_lit_width = 22
struct_variant_width = 42
array_width = 72
