[package]
name = "ton_ledger"
version = "0.1.1"
description = "Verified TON Ledger wallet signing over USB, Bluetooth or custom transports"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
readme = "README.md"
publish = true
include = ["src/**", "tests/**", "README.md", "AGENTS.md", "CHANGELOG.md", "LICENSE*", "NOTICE"]

[features]
default = ["hid"]
hid = ["dep:hidapi"]
ble = ["dep:btleplug", "dep:uuid", "dep:futures-util"]

[dependencies]
ton = { path = "../ton", version = "0.4", default-features = false }
async-trait.workspace = true
derive_setters.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
hidapi = { version = "2", optional = true }
btleplug = { version = "0.13", optional = true }
uuid = { version = "1", optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
anyhow.workspace = true
hex.workspace = true
