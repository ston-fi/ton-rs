[package]
name = "ton"
version = "0.4.2"
description.workspace = true
keywords.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true


include = [
    "AGENTS.md",
    "Cargo.toml",
    "src/*",
    "tests/*",
    "resources/*",
]

[features]
lite-client = [
    "dep:adnl",
    "dep:auto_pool",
    "dep:dashmap",
    "dep:everscale-types",
    "dep:tokio-retry",
    "dep:tokio-tower",
    "dep:ton_liteapi",
    "dep:tower",
]
tonlibjson = ["dep:tonlib-sys", "lite-client"]
unstable = []


[dependencies]
# Internal
ton_macros = {workspace = true}
ton_core = {workspace = true, features = ["serde"] }
tonlib-sys = { workspace = true, optional = true }


# External
adnl = { workspace = true, optional = true }
auto_pool = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
everscale-types = { workspace = true, optional = true }
moka.workspace = true
async-recursion.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
ed25519-dalek.workspace = true
crc.workspace = true
hex.workspace = true
base64.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-retry = { workspace = true, optional = true }
tokio-tower = { workspace = true, optional = true }
ton_liteapi = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
rand.workspace = true
strum.workspace = true
serde-aux.workspace = true
base64-serde.workspace = true
async-trait.workspace = true
futures-util.workspace = true
libc.workspace = true
sha2.workspace = true
reqwest.workspace = true
derive_setters.workspace = true
fastnum.workspace = true
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
tokio-test.workspace = true
tokio.workspace = true
log4rs.workspace = true
