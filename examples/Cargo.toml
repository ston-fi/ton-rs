[package]
name = "examples"
rust-version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
ledger-ble = ["dep:ton_ledger", "ton_ledger/ble", "ton_ledger/hid", "ton/lite-client"]
tonlibjson = ["ton/tonlibjson"]

[dependencies]
ton_ledger = { path = "../crates/ton_ledger", version = "0.1", default-features = false, optional = true }
ton = { path = "../crates/ton", version = "0" }
ton_core = { path = "../crates/ton_core", version = "0" }

hex = "0.4"
num-bigint = { version = "0.4" }
anyhow = "1.0"
tonlib-core = "0.26"
tokio = {version = "1.46", features =["rt", "macros"]}
log4rs = "1.3"
log = "0.4"
async-trait = "0.1"
zeroize.workspace = true
rand.workspace = true


[[example]]
name = "tonlib_core_perf_cell_from_boc"
path = "tonlib_core_perf_cell_from_boc.rs"

[[example]]
name = "ton_core_perf_cell_from_boc"
path = "ton_core_perf_cell_from_boc.rs"

[[example]]
name = "tonlib_core_perf_build_cell"
path = "tonlib_core_perf_build_cell.rs"

[[example]]
name = "ton_core_perf_build_cell"
path = "ton_core_perf_build_cell.rs"

[[example]]
name = "ton_types_tlb_build_dict_large"
path = "ton_types_tlb_build_dict_large.rs"

[[example]]
name = "ton_read_tx_data"
path = "ton_read_tx_data.rs"

[[example]]
name = "ton_transfer"
path = "ton_transfer.rs"

[[example]]
name = "ton_emulate_get_method"
path = "ton_emulate_get_method.rs"

[[example]]
name = "ton_core_enum"
path = "ton_core_enum.rs"

[[example]]
name = "ton_ledger_self_transfer"
path = "ton_ledger_self_transfer.rs"
required-features = ["ledger-ble"]
