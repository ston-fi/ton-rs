name: Build-Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A main build may be publishing; only superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  format:
    runs-on: ubuntu-24.04
    outputs:
      tonlibjson: ${{ steps.changes.outputs.tonlibjson }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "tonlibjson=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          changes=$(git diff --name-only --no-renames "$BASE" "$HEAD" -- \
            Cargo.toml '**/Cargo.toml' .cargo .github/workflows \
            crates/ton/src/lib.rs \
            crates/ton/src/emulators.rs crates/ton/src/emulators \
            crates/ton/src/sys_utils.rs crates/ton/src/sys_utils \
            crates/ton/src/test_utils.rs crates/ton/src/test_utils \
            crates/ton/src/tl_client.rs crates/ton/src/tl_client \
            crates/ton/tests crates/ton/resources \
            examples/ton_transfer.rs examples/ton_emulate_get_method.rs \
            benchmarks/tx_emulator_bench.rs)
          if [[ -n "$changes" ]]; then
            echo "tonlibjson=true" >> "$GITHUB_OUTPUT"
          else
            echo "tonlibjson=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-27
          components: rustfmt
      - run: cargo fmt --check

  build_all_default_features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --lib --locked --exclude examples
      - run: cargo test --workspace --doc --locked

  build_all_all_features:
    needs: format
    runs-on: ubuntu-24.04
    env:
      # Keep the non-native feature list in sync with workspace manifests.
      FEATURES: ${{ needs.format.outputs.tonlibjson == 'true' && '--all-features' || '--features=ton/lite-client,ton/unstable,ton_core/serde,ton_ledger/ble,examples/ledger-ble,benchmarks/tonunstable' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - name: Install native libraries
        if: needs.format.outputs.tonlibjson == 'true'
        run: |
          sudo apt-get install -y clang libsodium-dev libsecp256k1-dev liblz4-dev
          sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-21
          sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-21
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - run: cargo generate-lockfile
      # tonlib-sys builds with -march=native; do not restore another CPU's binaries.
      - name: Identify native build cache
        if: needs.format.outputs.tonlibjson == 'true'
        id: native-cache
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "tonlib-sys"))')
          key=$({ echo "$version"; clang --version; LC_ALL=C lscpu | sed -n '/^Model name:/p; /^Flags:/p'; } | sha256sum | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # Cargo's git-cache cleanup deletes tonlib-sys's default native build directory.
          echo "TON_MONOREPO_DIR=$RUNNER_TEMP/tonlib-sys-$version" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: needs.format.outputs.tonlibjson == 'true'
        with:
          path: ${{ env.TON_MONOREPO_DIR }}
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-${{ steps.native-cache.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}-${{ steps.native-cache.outputs.key }}
      - run: cargo clippy --workspace --all-targets "$FEATURES" --locked -- -D warnings
      - run: cargo test --workspace --lib "$FEATURES" --locked
      - run: cargo test --workspace --doc "$FEATURES" --locked
      - run: cargo check --workspace --examples "$FEATURES" --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps "$FEATURES" --locked

  msrv:
    needs: format
    uses: ./.github/workflows/msrv.yml
    with:
      tonlibjson: ${{ needs.format.outputs.tonlibjson == 'true' }}

  ci:
    name: CI
    if: always()
    needs: [format, build_all_default_features, build_all_all_features, msrv]
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && 'success' || 'failure' }}

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
