name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  workflow_call:

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ledger USB build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Prepare dependency cache
        # rust-cache hashes every installed toolchain, including unused runner defaults.
        run: |
          active=$(rustup show active-toolchain)
          rustup toolchain list | while read -r toolchain _; do
            if [[ "$toolchain" != "${active%% *}" ]]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
          cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deps-release
      - name: Install release tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.48.0,release-plz@0.3.159
      - name: Configure git user
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run release-plz
        run: |
          CARGO_SEMVER_CHECKS_BIN="$(command -v cargo-semver-checks)"
          export CARGO_SEMVER_CHECKS_BIN
          export PATH="$GITHUB_WORKSPACE/.github/scripts:$PATH"
          release-plz release-pr \
            --git-token "$GITHUB_TOKEN" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          release-plz release \
            --git-token "$GITHUB_TOKEN" \
            --token "$CARGO_REGISTRY_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_REGISTRY_TOKEN }}
